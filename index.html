<style>
  #vm-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #0b1712 0%, #142820 50%, #0b3d2e 100%);
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }

  #vm-loader.vm-loader-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .vm-loader-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    animation: vm-fade-in 0.6s ease forwards;
  }

  @keyframes vm-fade-in {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .vm-loader-logo {
    width: 80px;
    height: 80px;
    background: rgba(184,154,99,0.1);
    border: 2px solid rgba(184,154,99,0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: vm-pulse 1.8s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(184,154,99,0.4);
  }

  @keyframes vm-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(184,154,99,0.4); transform: scale(1); }
    50%  { box-shadow: 0 0 0 16px rgba(184,154,99,0); transform: scale(1.05); }
    100% { box-shadow: 0 0 0 0 rgba(184,154,99,0); transform: scale(1); }
  }

  .vm-loader-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
  }

  .vm-brand-voyage { color: #ffffff; }
  .vm-brand-mara   { color: #b89a63; }

  .vm-loader-bar {
    width: 200px;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    overflow: hidden;
  }

  .vm-loader-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #b89a63, #ddc99b, #b89a63);
    background-size: 200% 100%;
    border-radius: 99px;
    animation: vm-progress 1.2s ease-in-out forwards, vm-shimmer 1.4s linear infinite;
  }

  @keyframes vm-progress {
    0%   { width: 0%; }
    40%  { width: 55%; }
    70%  { width: 80%; }
    100% { width: 100%; }
  }

  @keyframes vm-shimmer {
    0%   { background-position: 200% center; }
    100% { background-position: -200% center; }
  }

  .vm-loader-text {
    font-family: system-ui, sans-serif;
    font-size: 0.82rem;

    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
    animation: vm-blink 1.6s ease-in-out infinite;
  }

  @keyframes vm-blink {
    0%, 100% { opacity: 0.45; }
    50%       { opacity: 0.9; }
  }
</style>

<!-- ================= LOADER DISMISS SCRIPT ================= -->
<!-- Must be AFTER #root so getElementById('root') is not null -->
<script>
  (function() {
    var loader = document.getElementById('vm-loader');

    function hide() {
      if (!loader) return;
      loader.classList.add('vm-loader-hidden');
      setTimeout(function() {
        if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
      }, 400);
    }

    var root = document.getElementById('root');

    // Hide loader the moment React inserts anything into #root
    var observer = new MutationObserver(function() {
      if (root && root.firstElementChild) {
        observer.disconnect();
        hide();
      }
    });

    if (root) {
      observer.observe(root, { childList: true, subtree: true });
    }

    // Safety fallback: hide after 2.5 seconds no matter what
    setTimeout(hide, 2500);
  })();
</script>
